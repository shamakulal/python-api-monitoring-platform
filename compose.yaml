services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: python-api-container
    ports:
      - "8000:8000"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    restart: unless-stopped
    depends_on:
      - api

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    restart: unless-stopped
    depends_on:
      - prometheus

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    ports:
      - "9100:9100"
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager
    ports:
      - "9093:9093"
    volumes:
      - alertmanager_config:/etc/alertmanager-generated:ro
    command:
      - "--config.file=/etc/alertmanager-generated/alertmanager.yml"
    restart: unless-stopped
    depends_on:
      - alertmanager-config

  alertmanager-config:
    image: python:3.13-slim
    container_name: alertmanager-config
    env_file:
      - .env
    volumes:
      - ./monitoring/alertmanager.template.yml:/app/alertmanager.template.yml:ro
      - ./monitoring/render_alertmanager.py:/app/render_alertmanager.py:ro
      - alertmanager_config:/shared
    command:
      - python
      - /app/render_alertmanager.py
    restart: "no"
volumes:
  prometheus_data:
  grafana_data:
  alertmanager_config: